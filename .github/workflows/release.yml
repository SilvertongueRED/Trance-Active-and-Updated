name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '"version":\s*"\K[^"]+' manifest.json | head -n 1)
          ZIP="Trance-v${VERSION}.zip"
          NOTES="release-notes/v${VERSION}.md"
          rm -rf stage "$ZIP"
          mkdir -p stage/Trance
          git archive HEAD | tar -x -C stage/Trance
          rm -rf stage/Trance/.github stage/Trance/release-notes stage/Trance/.gitignore
          (cd stage && zip -r "../$ZIP" Trance)
          unzip -l "$ZIP" | tail -n 5
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            gh release create "v${VERSION}" "$ZIP" --target "$GITHUB_SHA" --title "Trance v${VERSION}" --notes-file "$NOTES"
          fi
